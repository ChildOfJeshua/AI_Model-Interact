<!--Structure and Language for the document -->
<!DOCTYPE html>
<html lang="en">

<!--Meta Data or data not seen by on UI(website on the internet) by user (You)-->
<head>
	
	<!--Character encoding to UTF-8-->
	<meta charset="utf-8">

	<!--Responsive for mobile devices-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!--Tab Page Title Name-->
	<title> Ai Chat Interface </title>
	
	<!--SEO Site Details-->
	<meta name="description" content="Welcome to an Ai Chat Interface whereby user input is taken in for exchange with AI response.">

	<!--Favicon or image next to the Tab tag name-->
	<link rel="icon" href="images/computer-svgrepo-com.svg" type="image/svg+xml">
    	<link rel="stylesheet" href="css/css_styling.css">

    	<!-- 1. React Library -->
    	<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    
    	<!-- 2. React DOM Library -->
    	<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    	<!-- 3. Babel (to translate JSX to JavaScript) -->
    	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>


<!--Visible Content-->
<body>
    <!-- 1. Root Container for React -->
    <div id="root"></div>

    <!-- 2. React Logic Script -->
    <script type="text/babel">
        // Import React Hooks
        const { useState, useEffect, useRef } = React;

        // --- 5. Create the Message Component ---
        const MessageBubble = ({ role, content }) => {
            let className = "message";
            if (role === 'user') className += " user";
            else if (role === 'ai') className += " ai";
            else className += " system";

            return (
                <div className={className}>
                    {content}
                </div>
            );
        };

        // --- 7. Add Loading Logic Component ---
        const TypingIndicator = () => (
            <div className="loading">
                <span>Leo is thinking...</span>
            </div>
        );

        // --- 6. Initialize State & 13. Refactor into Components ---
        const App = () => {
            // State: Chat History
            const [messages, setMessages] = useState([
                { role: 'system', content: 'Welcome! Please enter your OpenRouter API key above to start chatting.' }
            ]);
            
            // State: User Input
            const [input, setInput] = useState('');
            
            // State: API Key (with localStorage persistence)
            const [apiKey, setApiKey] = useState('');
            
            // State: Loading Status
            const [isLoading, setIsLoading] = useState(false);
            
            // State: Errors
            const [error, setError] = useState(null);
            
            // Ref: For Auto-Scrolling
            const messagesEndRef = useRef(null);

            // --- 12. Manage Scroll Effect ---
            useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [messages, isLoading]);

            // Load API key from storage on mount
            useEffect(() => {
                const storedKey = localStorage.getItem('openrouter_api_key');
                if (storedKey) setApiKey(storedKey);
            }, []);

            // Save API key when changed
            const handleApiKeyChange = (e) => {
                const key = e.target.value;
                setApiKey(key);
                localStorage.setItem('openrouter_api_key', key);
            };

            // --- 8. Validate Input, 9. Connect API, 10. Handle Errors ---
            const handleSend = async () => {
                // 8. Validate Input
                if (!input.trim() || isLoading) return;
                if (!apiKey) {
                    setError("Please enter an API Key first.");
                    return;
                }
                setError(null);

                const userMessage = { role: 'user', content: input };
                
                // Optimistic UI Update (Show user message immediately)
                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setIsLoading(true);

                try {
                    // 9. Connect the API
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.href,
                            "X-Title": "Leo AI Demo"
                        },
                        body: JSON.stringify({
                            "model": "meta-llama/llama-3.1-8b-instruct",
                            "messages": [
                                ...messages.map(m => ({ role: m.role, content: m.content })),
                                { role: "user", content: input }
                            ]
                        })
                    });

                    // 10. Handle Timeouts & Errors (Network)
                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || "Failed to fetch response");
                    }

                    const data = await response.json();
                    const aiContent = data.choices[0].message.content;

                    // 11. Render the Response (Update State)
                    setMessages(prev => [...prev, { role: 'ai', content: aiContent }]);

                } catch (err) {
                    // 10. Handle Errors (Logic)
                    console.error(err);
                    setError(err.message);
                    setMessages(prev => [...prev, { role: 'system', content: `Error: ${err.message}` }]);
                } finally {
                    setIsLoading(false);
                }
            };

            // Handle Enter Key
            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            // --- 11. Render the UI (The Structure) ---
            return (
                <div className="app-container">
                    {/* 3. Header: Title and API Input */}
                    <header>
                        <h1>Leo AI Chat</h1>
                        <div className="api-config">
                            <label htmlFor="api-key" style={{display: 'none'}}>API Key</label>
                            <input 
                                type="password" 
                                id="api-key"
                                className="api-input" 
                                placeholder="Enter OpenRouter Key" 
                                value={apiKey}
                                onChange={handleApiKeyChange}
                            />
                        </div>
                    </header>

                    {/* 4. Main Chat Area: Messages and Scroll Anchor */}
                    <main>
                        {messages.map((msg, index) => (
                            <MessageBubble 
                                key={index} 
                                role={msg.role} 
                                content={msg.content} 
                            />
                        ))}
                        
                        {isLoading && <TypingIndicator />}
                        
                        <div ref={messagesEndRef}></div>
                    </main>

                    {/* 5. Error Message Container */}
                    {error && <div className="error-msg">{error}</div>}

                    {/* 2. Footer: Input and Send Button */}
                    <footer>
                        <textarea 
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder="Type your message..."
                            disabled={isLoading}
                        />
                        <button 
                            onClick={handleSend} 
                            disabled={isLoading || !input.trim()}
                        >
                            {isLoading ? '...' : 'Send'}
                        </button>
                    </footer>
                </div>
            );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
